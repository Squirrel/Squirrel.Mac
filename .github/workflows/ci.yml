name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Newest Xcode available on each runner image. macOS coverage is
        # what we care about; we don't need a separate cell per Xcode.
        include:
          - { os: macos-14,       xcode: '16.2', name: 'macOS 14 arm64'  }
          - { os: macos-15,       xcode: '26.3', name: 'macOS 15 arm64'  }
          - { os: macos-15-intel, xcode: '26.3', name: 'macOS 15 x86_64' }
          - { os: macos-26,       xcode: '26.4', name: 'macOS 26 arm64'  }
          - { os: macos-26-intel, xcode: '26.4', name: 'macOS 26 x86_64' }
    env:
      DEPOT_TOOLS_UPDATE: '0'
      DEPOT_TOOLS_METRICS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: gclient sync
        run: |
          cp standalone.gclient .gclient
          gclient sync --no-history --shallow

      - name: gn gen
        run: buildtools/mac/gn gen out/Default

      - name: Build
        run: third_party/ninja/ninja -C out/Default

      - name: Test
        # shellcheck disable=SC2266 # script/test is a path, not the `test` builtin
        run: script/test out/Default

  ci-green:
    name: ci-green
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: All matrix cells succeeded
        if: needs.test.result != 'success'
        run: |
          echo "::error::matrix result was '${{ needs.test.result }}'"
          exit 1
